services:
  timeandmotion:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmvtm
    ports:
      - "8080:8080"
    environment:
      # Development so Swagger is available at /swagger for the demo
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Data Source=/data/gmvtm.db
    volumes:
      - gmvtm-data:/data
    restart: unless-stopped

volumes:
  gmvtm-data:
